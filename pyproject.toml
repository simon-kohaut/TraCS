[build-system]
requires = ["setuptools>=61"]
build-backend = "setuptools.build_meta"

[project]
name = "tracs"
dynamic = ["version"]
description = "A Python package to apply probabilistic logic programming to motion prediction tasks."
readme = "README.md"
license = { text = "BSD-3-Clause" }
authors = [
    { name = "Simon Kohaut", email = "simon.kohaut@cs.tu-darmstadt.de" },
    { name = "Felix Divo", email = "felix.divo@cs.tu-darmstadt.de" },
    { name = "Julius Hahnewald" },
]
requires-python = ">=3.13"
classifiers = [
    "Programming Language :: Python :: 3",
    "License :: OSI Approved :: BSD License",
    "Operating System :: OS Independent",
]
dependencies = [
    # "promis>=4.0.0.dev1",
    "promis @ git+https://github.com/HRI-EU/ProMis.git@main",
	"langchain[ollama,anthropic,openai,google-genai]>=1.3.1",
    "python-dotenv>=1.0",
    "rich>=15.0",
    "ipykernel",
    "seaborn",
    "statsmodels",
    "av2",
]

[project.scripts]
tracs_gen = "tracs.cli:main"
tracs_run_all = "tracs.run_all:main"
tracs_show = "tracs.show_trace:main"
tracs_add_judge = "tracs.add_judge:main"

[tool.setuptools.packages.find]
include = ["tracs*"]

[tool.setuptools.dynamic]
version = { attr = "tracs.__version__" }

[tool.setuptools.package-data]
tracs = ["py.typed"]
